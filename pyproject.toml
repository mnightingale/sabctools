[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "sabctools"
dynamic = ["version"]
description = "C implementations of functions for use within SABnzbd"
readme = "README.md"
authors = [
    {name = "Safihre", email = "safihre@sabnzbd.org"},
]
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE.md"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Usenet News",
]

[project.urls]
Homepage = "https://github.com/sabnzbd/sabctools/"
Source = "https://github.com/sabnzbd/sabctools/"
Issues = "https://github.com/sabnzbd/sabctools/issues"

[dependency-groups]
test = [
    "pytest",
    "chardet",
    "jaraco.functools",
    "portend"
]

[tool.black]
line-length = 120
target-version = ['py310']
include = '(?:src|tests)\/.*\.pyi?'

[tool.cibuildwheel]
skip = "*i686* *t-*"
test-skip = "*"

[tool.cibuildwheel.linux]
archs = ["native"]
# CMakeLists.txt uses a compiler cache when one is on PATH, and here the
# compilers are the container's, not the host's - so the container is where
# ccache has to be installed. It earns its keep even without a store carried in
# from outside: one container builds every Python version in the matrix, and the
# ~130 vendored sources have no Python in them, so all but the first build of
# them is a hit. manylinux is dnf-based, musllinux apk-based. Failure to install
# is not fatal; CMake simply finds nothing and compiles as before.
before-all = """
if command -v apk > /dev/null; then apk add ccache || true
elif command -v dnf > /dev/null; then dnf install -y ccache || true
fi
ccache --version || true
"""

[tool.cibuildwheel.macos]
archs = ["universal2"]
build = "cp314-*"

[tool.cibuildwheel.windows]
archs = ["native"]
build = "cp314-*"
# Skip wheel repair: SABnzbd already bundles the required runtime DLLs
repair-wheel-command = ""

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.15"
# Keep the CMake cache between builds, so an incremental rebuild does not
# reconfigure and recompile the vendored trees from scratch.
build-dir = "build/{wheel_tag}"
# CMakeLists.txt installs the package files explicitly; src/ is mostly C++.
wheel.packages = []

# The version is defined once, in the C sources
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/sabctools.h"
regex = '#define SABCTOOLS_VERSION +"(?P<value>[0-9xA-Z_.]+)"'
