name: Compiler cache
description: >
  Set up ccache and restore its directory, so the vendored par2 and rapidyenc
  trees are not recompiled from scratch on every build. Those are some 130
  source files with no Python in them, so they compile to identical objects for
  every Python version and every job in the matrix.

  Does nothing on Windows: scikit-build-core selects the Visual Studio generator
  there, and only the Makefile and Ninja generators honour
  CMAKE_<LANG>_COMPILER_LAUNCHER. Forcing Ninja instead would make CMake pick
  the first compiler on PATH, which on these runners is MinGW gcc.

inputs:
  scope:
    description: Which kind of job this is, to keep unrelated caches apart.
    required: true
  variant:
    description: >
      Optional extra key component, such as a Python version. Caches are still
      shared across variants on a miss, since the vendored objects do not differ.
    required: false
    default: none

runs:
  using: composite
  steps:
    - name: Configure ccache
      if: runner.os != 'Windows'
      shell: bash
      run: |
        echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"

    - name: Restore compiler cache
      if: runner.os != 'Windows'
      uses: actions/cache@v6
      with:
        path: .ccache
        # ccache is content-addressed, so a stale entry is a miss and never a
        # wrong hit. Write a fresh entry each run and restore the newest one,
        # falling back to another variant on the same runner.
        key: ccache-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.variant }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.variant }}-
          ccache-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Install ccache
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if ! command -v ccache > /dev/null; then
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ccache
          else
            sudo apt-get install -y ccache
          fi
        fi
        ccache --version
