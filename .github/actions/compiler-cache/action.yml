name: Compiler cache
description: >
  Install ccache and restore its store, so the vendored par2 and rapidyenc trees
  are not recompiled from scratch on every run. Those are some 130 source files
  with no Python in them, so they compile to identical objects for every Python
  version in the matrix.

  The key deliberately does not hash the sources. ccache is content-addressed -
  the compiler, the flags and the preprocessed source are already part of its
  internal hash - so a store from an older commit stays correct, and entries that
  no longer apply simply miss. Hashing sources into the key would throw the whole
  store away exactly when a vendored file changed, which is when reuse of the
  other 129 files matters most. A build *tree* is the opposite case and does need
  an exact key; see the git history for that variant.

  Does nothing on Windows: scikit-build-core selects the Visual Studio generator
  there, and only the Makefile and Ninja generators honour
  CMAKE_<LANG>_COMPILER_LAUNCHER. Forcing Ninja instead would make CMake pick the
  first compiler on PATH, which on these runners is MinGW gcc.

inputs:
  scope:
    description: Which kind of job this is, to keep unrelated caches apart.
    required: true
  variant:
    description: >
      Extra key component, such as a Python version. Stores are still shared
      across variants on a miss, since the vendored objects do not differ.
    required: false
    default: none

runs:
  using: composite
  steps:
    - name: Configure ccache
      if: runner.os != 'Windows'
      shell: bash
      run: |
        echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
        # Stops actions/cache warning about a missing path on the first run.
        mkdir -p "${{ github.workspace }}/.ccache"

    - name: Restore compiler cache
      if: runner.os != 'Windows'
      uses: actions/cache@v6
      with:
        path: .ccache
        # Unique per run so each run writes a fresh entry, then fall back to the
        # newest store for this variant, and failing that any variant on this
        # runner - the vendored objects are identical across Python versions.
        key: ccache-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.variant }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.variant }}-
          ccache-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Install ccache
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if ! command -v ccache > /dev/null; then
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ccache
          else
            sudo apt-get install -y ccache
          fi
        fi
        ccache --version
