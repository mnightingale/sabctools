name: Tests and build wheels

on: [push, pull_request]
permissions: read-all

jobs:
  black:
    name: Black Code Formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install black
      - run: >
          black
          .
          --check
          --diff

  ci:
    name: Tests ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14', '3.15-dev' ]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ matrix.python-version }}

      # Pays off across the matrix rather than within a job: every Python
      # version here compiles the vendored sources to the same objects.
      - uses: ./.github/actions/compiler-cache
        with:
          scope: ci
          variant: ${{ matrix.python-version }}

      - name: Build module and run pytest
        run: |
          python -m pip install --upgrade pip
          pip install --group test
          pip install . -v
          python -c "import sabctools; print('Version:', sabctools.__version__);"
          python -c "import sabctools; print('SIMD:', sabctools.simd);"
          python -c "import sabctools; print('OpenSSL linked:', sabctools.openssl_linked);"
          python -c "import sabctools; print('par2:', sabctools.Par2Repairer);"
          pytest

  build_wheels:
    name: Build wheels on ${{ matrix.os }} ${{ matrix.linux_arch }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: windows-11-arm
          - os: macos-latest
          - os: ubuntu-latest
            linux_arch: x86_64
          - os: ubuntu-24.04-arm
            linux_arch: aarch64

    steps:
      - uses: actions/checkout@v7

      # Here the same objects get rebuilt for every Python version in a single
      # job - five times over on Linux.
      - uses: ./.github/actions/compiler-cache
        with:
          scope: wheels

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1
        env:
          # Linux wheels build in a container, which has neither ccache nor the
          # environment set up above. Failing to install one only costs us the
          # cache, so it must not fail the wheel.
          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y ccache || yum install -y ccache || apk add ccache || true
          # /project is where cibuildwheel mounts the checkout, so the cache ends
          # up back in the workspace for actions/cache to save.
          CIBW_ENVIRONMENT_LINUX: CCACHE_DIR=/project/.ccache CCACHE_MAXSIZE=500M
          # macOS wheels build on the host, but pass the settings in rather than
          # trusting them to be inherited - if they were not, ccache would
          # quietly use ~/.ccache and nothing would ever be saved.
          CIBW_ENVIRONMENT_MACOS: CCACHE_DIR=$CCACHE_DIR CCACHE_MAXSIZE=$CCACHE_MAXSIZE

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          path: ./wheelhouse/*.whl
          name: Wheels ${{ matrix.os }} ${{ matrix.linux_arch }}
      - name: Install Python
        uses: actions/setup-python@v7
        if: runner.os == 'macOS'
        with:
          python-version: "3.13"
      - name: Build source distribution
        if: runner.os == 'macOS'
        run: |
          pip install build
          python -m build --sdist
      - name: Upload source distribution artifact
        uses: actions/upload-artifact@v7.0.1
        if: runner.os == 'macOS'
        with:
          path: ./dist/*.tar.gz
          name: Source distribution

  publish:
    name: Publish release to GitHub and PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'sabnzbd/sabctools'
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist/
          merge-multiple: true
      - name: Publish release to GitHub (gh)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" ./dist/*.tar.gz \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          skip-existing: true
